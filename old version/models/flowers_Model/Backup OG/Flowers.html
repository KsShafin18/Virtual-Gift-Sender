<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="flower-id" content="rose">

  <title>Rose flower model</title>
  <style>

</head>
<body>

      </defs>
      <g fill="url(#rosePetal)" stroke="#97133d" stroke-width="1.2">

      </g>

  </template>
  <script>
    document.querySelector('#preview').replaceChildren(document.querySelector('#flower-art').content.cloneNode(true));
  </script>

</html>
