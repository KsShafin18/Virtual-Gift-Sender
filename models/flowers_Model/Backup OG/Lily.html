<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="flower-id" content="lily">
  <meta name="flower-name" content="Lilies">
  <meta name="flower-emoji" content="🌸">
  <meta name="flower-description" content="Graceful, tender and softly glowing.">
  <title>Lily flower model</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#190d19;color:#fff;font:16px system-ui}main{text-align:center}#preview{width:min(70vw,320px);height:min(70vw,320px)}#preview svg{width:100%;height:100%}</style>
</head>
<body>
  <main><div id="preview" aria-label="Lily model preview"></div><p>Lily · reusable flower model</p></main>
  <template id="flower-art">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <defs><linearGradient id="lilyPetal" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset=".52" stop-color="#ffe4f0"/><stop offset="1" stop-color="#df79ad"/></linearGradient></defs>
      <g fill="url(#lilyPetal)" stroke="#c45c91" stroke-width="1">
        <path d="M50 53C34 44 31 22 50 8C69 22 66 44 50 53Z"/>
        <path d="M50 53C33 49 22 31 29 13C50 19 59 39 50 53Z" transform="rotate(60 50 50)"/>
        <path d="M50 53C33 49 22 31 29 13C50 19 59 39 50 53Z" transform="rotate(120 50 50)"/>
        <path d="M50 53C34 44 31 22 50 8C69 22 66 44 50 53Z" transform="rotate(180 50 50)"/>
        <path d="M50 53C33 49 22 31 29 13C50 19 59 39 50 53Z" transform="rotate(240 50 50)"/>
        <path d="M50 53C33 49 22 31 29 13C50 19 59 39 50 53Z" transform="rotate(300 50 50)"/>
      </g>
      <g fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.1">
        <path d="M50 50Q47 31 50 14"/><path d="M50 50Q37 36 31 18" transform="rotate(60 50 50)"/>
        <path d="M50 50Q37 36 31 18" transform="rotate(120 50 50)"/><path d="M50 50Q47 31 50 14" transform="rotate(180 50 50)"/>
      </g>
      <g stroke="#d97706" stroke-width="1.3" stroke-linecap="round">
        <path d="M49 48L42 28"/><path d="M50 47L50 25"/><path d="M51 48L58 28"/>
        <path d="M49 48L36 34"/><path d="M51 48L64 34"/>
      </g>
      <g fill="#f59e0b"><circle cx="42" cy="28" r="2"/><circle cx="50" cy="25" r="2"/><circle cx="58" cy="28" r="2"/><circle cx="36" cy="34" r="2"/><circle cx="64" cy="34" r="2"/></g>
      <circle cx="50" cy="50" r="3" fill="#f5bd5b"/>
    </svg>
  </template>
  <script>document.querySelector('#preview').replaceChildren(document.querySelector('#flower-art').content.cloneNode(true));</script>
</body>
</html>
